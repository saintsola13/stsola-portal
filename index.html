<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FCKOFF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-red: #ff2a2a;
      --neon-orange: #ff6b00;
      --glass-bg: rgba(20, 8, 12, 0.5);
      --glass-border: rgba(255, 80, 60, 0.28);
      --text: #f5e6e0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', system-ui, sans-serif;
      color: var(--text);
    }

    body {
      background: #050005 url('bg.jpg') center center / cover no-repeat fixed;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #lock-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 360px;
      animation: fadeIn 0.55s ease;
    }

    #lock-screen.hidden { display: none; }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(2.4rem, 9vw, 3.6rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff3b3b 0%, #ff8c00 50%, #ff3b3b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(255, 50, 30, 0.55));
    }

    .subtitle {
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      letter-spacing: 0.28em;
      color: rgba(255, 180, 140, 0.8);
      text-transform: uppercase;
    }

    .pin-dots {
      display: flex;
      gap: 16px;
      margin: 0.4rem 0 0.1rem;
    }

    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid rgba(255, 100, 80, 0.55);
      background: transparent;
      transition: all 0.18s ease;
    }

    .dot.filled {
      background: var(--neon-red);
      border-color: var(--neon-red);
      box-shadow: 0 0 14px var(--neon-red);
    }

    .pin-error {
      height: 1.25rem;
      font-family: 'VT323', monospace;
      font-size: 1.15rem;
      color: #ff5555;
      opacity: 0;
      transition: opacity 0.25s;
      letter-spacing: 0.1em;
    }

    .pin-error.show { opacity: 1; }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      width: 100%;
      max-width: 270px;
    }

    .num-btn {
      aspect-ratio: 1;
      border: 1px solid rgba(255, 80, 60, 0.35);
      border-radius: 50%;
      background: rgba(25, 5, 12, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.14s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .num-btn:hover, .num-btn:active {
      background: rgba(255, 40, 30, 0.4);
      border-color: var(--neon-red);
      box-shadow: 0 0 22px rgba(255, 40, 30, 0.45);
      transform: scale(0.95);
    }

    .num-btn.clear { font-size: 0.8rem; letter-spacing: 0.06em; }

    #portal {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 1.4rem 1rem 1.8rem;
      overflow-y: auto;
      animation: fadeIn 0.65s ease;
    }

    #portal.visible { display: flex; }

    .portal-header {
      text-align: center;
      margin-bottom: 1.6rem;
      flex-shrink: 0;
    }

    .portal-header h1 {
      font-size: clamp(1.5rem, 5vw, 2.3rem);
      font-weight: 900;
      letter-spacing: 0.14em;
      background: linear-gradient(90deg, #ff3b3b, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }

    .portal-header p {
      font-family: 'VT323', monospace;
      font-size: 1.25rem;
      letter-spacing: 0.22em;
      color: rgba(255, 170, 130, 0.75);
    }

    .tiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding-bottom: 1.5rem;
    }

    .tile {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.35rem 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-height: 115px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
    }

    .tile::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 60, 40, 0.15), transparent 65%);
      opacity: 0;
      transition: opacity 0.22s;
    }

    .tile:hover {
      transform: translateY(-5px) scale(1.015);
      border-color: rgba(255, 90, 50, 0.6);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5), 0 0 28px rgba(255, 40, 30, 0.3);
    }

    .tile:hover::before { opacity: 1; }

    .tile-title {
      font-weight: 700;
      font-size: 1.12rem;
      letter-spacing: 0.05em;
      color: #fff;
      position: relative;
    }

    .tile-url {
      font-family: 'VT323', monospace;
      font-size: 0.98rem;
      color: rgba(255, 160, 120, 0.7);
      word-break: break-all;
      position: relative;
      line-height: 1.25;
    }

    .tile-arrow {
      position: absolute;
      top: 1.05rem;
      right: 1.15rem;
      font-size: 1.15rem;
      opacity: 0.45;
      transition: all 0.22s;
    }

    .tile:hover .tile-arrow {
      opacity: 1;
      transform: translateX(4px);
      color: var(--neon-orange);
    }

    .footer {
      margin-top: auto;
      text-align: center;
      padding-top: 1.2rem;
      font-family: 'VT323', monospace;
      font-size: 1.05rem;
      color: rgba(255, 140, 100, 0.5);
      letter-spacing: 0.18em;
    }

    .lock-btn {
      margin-top: 0.7rem;
      background: transparent;
      border: 1px solid rgba(255, 80, 60, 0.35);
      color: rgba(255, 160, 120, 0.75);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      padding: 0.4rem 1.15rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lock-btn:hover {
      border-color: var(--neon-red);
      color: #fff;
      background: rgba(255, 40, 30, 0.2);
    }

    .audio-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(12, 4, 8, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 80, 60, 0.25);
      padding: 0.7rem 1.2rem;
      display: none;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
    }

    .audio-bar.visible { display: flex; }

    .audio-play {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 80, 60, 0.45);
      background: rgba(255, 40, 30, 0.2);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .audio-play:hover {
      background: rgba(255, 40, 30, 0.45);
      box-shadow: 0 0 16px rgba(255, 40, 30, 0.4);
    }

    .audio-info { flex: 1; min-width: 0; }

    .audio-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .audio-sub {
      font-family: 'VT323', monospace;
      font-size: 0.9rem;
      color: rgba(255, 160, 120, 0.65);
      letter-spacing: 0.08em;
    }

    .audio-progress {
      flex: 1.2;
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
      max-width: 180px;
    }

    .audio-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff3b3b, #ff8c00);
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    @media (max-width: 500px) { .audio-progress { display: none; } }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .tiles-grid { grid-template-columns: 1fr; gap: 0.85rem; }
      .numpad { max-width: 250px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="lock-screen">
      <div class="logo">FCKOFF</div>
      <div class="subtitle">Loyalty Over Bullshit</div>

      <div class="pin-dots" id="pin-dots">
        <div class="dot" data-i="0"></div>
        <div class="dot" data-i="1"></div>
        <div class="dot" data-i="2"></div>
        <div class="dot" data-i="3"></div>
        <div class="dot" data-i="4"></div>
        <div class="dot" data-i="5"></div>
      </div>
      <div class="pin-error" id="pin-error">WRONG CODE</div>

      <div class="numpad" id="numpad">
        <button class="num-btn" data-n="1">1</button>
        <button class="num-btn" data-n="2">2</button>
        <button class="num-btn" data-n="3">3</button>
        <button class="num-btn" data-n="4">4</button>
        <button class="num-btn" data-n="5">5</button>
        <button class="num-btn" data-n="6">6</button>
        <button class="num-btn" data-n="7">7</button>
        <button class="num-btn" data-n="8">8</button>
        <button class="num-btn" data-n="9">9</button>
        <button class="num-btn clear" data-n="clear">CLR</button>
        <button class="num-btn" data-n="0">0</button>
        <button class="num-btn clear" data-n="del">⌫</button>
      </div>
    </div>

    <div id="portal">
      <div class="portal-header">
        <h1>FCKOFF</h1>
        <p>90s HIP HOP · WEST COAST</p>
      </div>

      <div class="tiles-grid" id="tiles"></div>

      <div class="footer">
        <div>FCKOFF · 90s FOREVER</div>
        <button class="lock-btn" id="lock-btn">LOCK</button>
      </div>
    </div>

    <div class="audio-bar" id="audio-bar">
      <button class="audio-play" id="audio-play" aria-label="Play/Pause">▶</button>
      <div class="audio-info">
        <div class="audio-title">FCKOFF</div>
        <div class="audio-sub">Theme Track</div>
      </div>
      <div class="audio-progress" id="audio-progress">
        <div class="audio-progress-fill" id="audio-fill"></div>
      </div>
    </div>

    <audio id="theme-audio" loop preload="metadata">
      <source src="saint-sola.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
    const CORRECT_PIN = '791313';
    let currentPin = '';

    const sites = [
      { title: 'St Sola', url: 'https://stsola.com/', desc: 'stsola.com' },
      { title: 'ITIA Galleria', url: 'https://itiagalleria.pages.dev/', desc: 'itiagalleria.pages.dev' },
      { title: 'Ricordi', url: 'https://ricordi.pages.dev/', desc: 'ricordi.pages.dev' },
      { title: 'Stzy Warroom', url: 'https://stzy-warroom.pages.dev/', desc: 'stzy-warroom.pages.dev' },
      { title: 'StSola Vault', url: 'https://stsolavault.saintsola13.workers.dev/', desc: 'stsolavault.workers.dev' },
      { title: 'MedAtlas', url: 'https://medatlas.icu/', desc: 'medatlas.icu' },
      { title: 'Aura Web', url: 'https://aura-web-preview.saintsola13.workers.dev/', desc: 'aura-web-preview' },
      { title: 'Saints Generator', url: 'https://saintsola13.github.io/saints-generator/', desc: 'saints-generator' },
      { title: 'HangMeng', url: 'https://hangmeng.pages.dev/', desc: 'hangmeng.pages.dev' },
    ];

    const lockScreen = document.getElementById('lock-screen');
    const portal = document.getElementById('portal');
    const dots = document.querySelectorAll('.dot');
    const errorEl = document.getElementById('pin-error');
    const tilesEl = document.getElementById('tiles');

    function updateDots() {
      dots.forEach((d, i) => d.classList.toggle('filled', i < currentPin.length));
    }

    function showError() {
      errorEl.classList.add('show');
      setTimeout(() => errorEl.classList.remove('show'), 1100);
    }

    function unlock() {
      lockScreen.classList.add('hidden');
      portal.classList.add('visible');
      sessionStorage.setItem('stsola_unlocked', '1');
      document.getElementById('audio-bar').classList.add('visible');
      document.getElementById('theme-audio').play().catch(() => {});
    }

    function lock() {
      currentPin = '';
      updateDots();
      portal.classList.remove('visible');
      lockScreen.classList.remove('hidden');
      sessionStorage.removeItem('stsola_unlocked');
      document.getElementById('audio-bar').classList.remove('visible');
      document.getElementById('theme-audio').pause();
    }

    function checkPin() {
      if (currentPin === CORRECT_PIN) unlock();
      else { showError(); currentPin = ''; updateDots(); }
    }

    function addDigit(n) {
      if (currentPin.length >= 6) return;
      currentPin += n;
      updateDots();
      if (currentPin.length === 6) setTimeout(checkPin, 160);
    }

    document.getElementById('numpad').addEventListener('click', (e) => {
      const btn = e.target.closest('.num-btn');
      if (!btn) return;
      const n = btn.dataset.n;
      if (n === 'clear') { currentPin = ''; updateDots(); }
      else if (n === 'del') { currentPin = currentPin.slice(0, -1); updateDots(); }
      else addDigit(n);
    });

    document.addEventListener('keydown', (e) => {
      if (portal.classList.contains('visible')) return;
      if (e.key >= '0' && e.key <= '9') addDigit(e.key);
      if (e.key === 'Backspace') { currentPin = currentPin.slice(0, -1); updateDots(); }
      if (e.key === 'Escape') { currentPin = ''; updateDots(); }
    });

    document.getElementById('lock-btn').addEventListener('click', lock);

    sites.forEach(s => {
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = s.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `<div class="tile-title">${s.title}</div><div class="tile-url">${s.desc}</div><div class="tile-arrow">→</div>`;
      tilesEl.appendChild(a);
    });

    if (sessionStorage.getItem('stsola_unlocked') === '1') unlock();

    const audio = document.getElementById('theme-audio');
    const audioBar = document.getElementById('audio-bar');
    const playBtn = document.getElementById('audio-play');
    const fill = document.getElementById('audio-fill');
    const progress = document.getElementById('audio-progress');

    playBtn.addEventListener('click', () => {
      if (audio.paused) { audio.play(); playBtn.textContent = '❚❚'; }
      else { audio.pause(); playBtn.textContent = '▶'; }
    });

    audio.addEventListener('play', () => { playBtn.textContent = '❚❚'; });
    audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    });

    progress.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progress.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    if (sessionStorage.getItem('stsola_unlocked') === '1') audioBar.classList.add('visible');
  </script>
</body>
</html>
